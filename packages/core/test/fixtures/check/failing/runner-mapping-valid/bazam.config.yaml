envs:
  uat:
    production: false
    vars:
      APP_URL: https://uat.app.example.test
      API_URL: https://api.uat.example.test
    hosts: [uat.app.example.test, api.uat.example.test]
    challenges:
      otp-email: [otp-mailpit, human]
      pin: [human]
  prod:
    production: true
    vars: { APP_URL: https://app.example.test, API_URL: https://api.example.test }
    hosts: [app.example.test, api.example.test]
    challenges: { pin: [human], face-scan: [human] }
secrets:
  providers: [env, dotenv]
  names: [DEMO_TOTP_SEED]
identities:
  customer:
    fixture: customer
runners:
  shop-suite:
    command: [node, suite.js]
    results: reports/*.xml
    format: junit
    mapping: interop/shop-suite.yaml
  api-suite:
    command: [node, api.js]
    results: out/*.xml
    format: junit
    mapping: interop/api-suite.yaml
  old-suite:
    command: [node, old.js]
    results: old/*.xml
    format: junit
    mapping: interop/old-suite.yaml
targets:
  web: { driver: playwright, browser: chromium, headless: true }
  shop-chrome: { runner: shop-suite }
