cases:
  - id: AUTH-SECRET-001
    title: Case that writes credentials into the file
    stage: draft
    risk: low
    targets: [web]
    steps:
      - note: AKIAIOSFODNN7EXAMPLE
      - note: ghp_000000000000000000000000000000000000
      - note: xoxb-000000000000-fake-slack-token
      - note: eyJhbGciOiJub25lIn0.eyJzdWIiOiJhZG1pbi0xIn0.ZmFrZQ
      - note: "-----BEGIN PRIVATE KEY----- fake"
      - request: { method: GET, url: "${env.API_URL}/me", headers: { X-Api-Key: fake-api-key-0123456789-ABCDEFGHIJ-xyz } }
      - expect: { visible: { id: dashboard } }
