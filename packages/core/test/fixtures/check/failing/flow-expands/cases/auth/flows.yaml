cases:
  - id: AUTH-FLOWS-001
    title: Case whose flows do not expand
    stage: draft
    risk: low
    targets: [web]
    steps:
      - use: { flow: logn, with: { email: "${identity.customer.email}" } }
      - use: login
      - use: loop-a
      - challenge: { kind: otp-email, trigger: { use: { flow: login, with: { email: ops@example.test } } }, fill: { id: code } }
      - expect: { visible: { id: dashboard } }
    finally:
      - use: logn
