envs:
  uat:
    production: false
    vars:
      APP_URL: https://uat.app.example.test
      API_URL: https://api.uat.example.test
    hosts: [uat.app.example.test, api.uat.example.test]
    challenges:
      otp-email: [otp-mailpit, human]
      pin: [human]
  prod:
    production: true
    vars: { APP_URL: https://app.example.test, API_URL: https://api.example.test }
    hosts: [app.example.test, api.example.test]
    challenges: { pin: [human], face-scan: [human] }
secrets:
  providers: [env, dotenv]
  names: [DEMO_TOTP_SEED]
identities:
  customer:
    fixture: customer
  ops:
    auth:
      web:
        strategy: session-cookie
        refreshEveryMs: 120000
        with:
          login: { url: https://app.example.test/login, until: { cookie: session } }
      api:
        strategy: api-key
        refreshEveryMs: 120000
        with: { header: x-api-key, value: fake-key }
      admin:
        strategy: session-cookie
        refreshEveryMs: 120000
        with:
          login: { url: https://app.example.test/login, until: { cookie: session } }
          refresh: { request: "GET https://app.example.test/session" }
targets:
  web: { driver: playwright, browser: chromium, headless: true }
