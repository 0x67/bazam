# Host ports default to values that rarely clash; override them with
# DEMO_APP_PORT, DEMO_MAILPIT_HTTP_PORT and DEMO_MAILPIT_SMTP_PORT.
services:
  app:
    build:
      context: ../..
      dockerfile: examples/demo-app/Dockerfile
    init: true
    ports:
      - "${DEMO_APP_PORT:-3300}:3000"
    environment:
      # passkeys are bound to the origin the browser sees, so it follows the host port
      DEMO_ORIGIN: "http://localhost:${DEMO_APP_PORT:-3300}"
      DEMO_TEST_HOOKS: "${DEMO_TEST_HOOKS:-1}"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${DEMO_MAILPIT_HTTP_PORT:-8325}:8025"
      - "${DEMO_MAILPIT_SMTP_PORT:-1325}:1025"
