name: CI

on:
  push:
    branches: [main]
  pull_request:
  # the Release workflow calls this with the commit it releases
  workflow_call:
    inputs:
      ref:
        description: Commit to check out; empty checks out the event's own commit
        type: string
        default: ""

permissions:
  contents: read

# a new push to a pull request stops the run it replaces; runs on main always finish.
# A call from Release takes the caller's workflow name, so it never waits behind CI on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vp install runs the prepare script, which installs no Git hook dispatcher with this set
  VP_GIT_HOOKS: "0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # installs Node, pnpm and the Vite+ version the root package.json names, then runs vp install;
      # a run called with a ref saves no cache, so it leaves this one off and only restores the browsers
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: ${{ inputs.ref == '' }}

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm check
      - run: pnpm brand:check

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir packages/driver-web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # the browsers are cached per Playwright version; the system packages they need are not, so they install either way
      - name: Restore the Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # the driver-web unit tests launch every engine, so all three go in before pnpm test
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir packages/driver-web exec playwright install --with-deps chromium firefox webkit

      - name: Save the Playwright browsers
        if: inputs.ref == '' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Install the system packages of the cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir packages/driver-web exec playwright install-deps chromium firefox webkit

      - run: pnpm test

  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: ${{ inputs.ref == '' }}

      # the acceptance runs call the built CLI
      - run: pnpm build

      # the app service has no healthcheck, so wait on the pages the demo's own tests poll
      - name: Start the demo app
        id: demo
        run: |
          docker compose -f examples/demo-app/docker-compose.yml up -d --build
          for url in http://localhost:3300/login http://localhost:8325/readyz; do
            curl --silent --show-error --fail --retry 30 --retry-delay 2 --retry-all-errors --output /dev/null "$url"
          done

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir packages/driver-web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir packages/driver-web exec playwright install --with-deps chromium firefox webkit

      - name: Save the Playwright browsers
        if: inputs.ref == '' && steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Install the system packages of the cached browsers
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir packages/driver-web exec playwright install-deps chromium firefox webkit

      # The secrets are the demo's public test values from examples/demo-app/README.md ("Demo credentials").
      # Repository secrets would not reach pull requests from forks or runs that Dependabot starts, and the
      # log would then mask every 2468 it prints.
      - name: Prepare the example project
        run: |
          cp examples/fixtures/identities.example.yaml examples/fixtures/identities.local.yaml
          mkdir -p examples/.bazam
          cat > examples/.bazam/secrets.env <<'EOF'
          DEMO_PIN=2468
          DEMO_TOTP_SEED=GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ
          DEMO_API_KEY=demo-api-key
          DEMO_BASIC_PASSWORD=demo-password
          DEMO_OAUTH_CLIENT_SECRET=demo-client-secret
          DEMO_HMAC_SECRET=demo-hmac-secret
          EOF

      - name: Demo app tests
        run: pnpm --filter demo-app test

      # node runs the built CLI directly, since pnpm exec turns every nonzero exit code into 1;
      # each engine runs even when an earlier one failed
      - name: Acceptance on Chromium
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: >-
          node packages/cli/dist/main.js run --root examples --env demo --suite acceptance --target web
          --channel answers-file --answers examples/fixtures/answers

      - name: Acceptance on Firefox
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: >-
          node packages/cli/dist/main.js run --root examples --env demo --suite acceptance --target web-firefox
          --channel answers-file --answers examples/fixtures/answers

      - name: Acceptance on WebKit
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: >-
          node packages/cli/dist/main.js run --root examples --env demo --suite acceptance --target web-webkit
          --channel answers-file --answers examples/fixtures/answers

      # the example's node:test suite, through runner demo-node-test; before the scan, so it covers this run
      - name: External suite on node:test
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: node packages/cli/dist/main.js run --root examples --env demo --target node-test --channel answers-file

      # also after a failed run, whose traces are the evidence most likely to hold a value; besides the secrets
      # above it looks for the cached credentials, the TOTP codes of the seed and the codes the demo mailed
      - name: Scan the runs for secrets
        id: scan
        if: ${{ !cancelled() && steps.demo.outcome == 'success' }}
        run: node scripts/secret-scan.ts examples --totp-seed DEMO_TOTP_SEED --mailpit http://localhost:8325

      # for a failed run, and only once the scan found nothing in its evidence
      - name: Upload the run evidence
        if: ${{ failure() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-runs
          path: examples/runs
          retention-days: 7
          if-no-files-found: ignore
